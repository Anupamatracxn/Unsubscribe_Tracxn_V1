<!DOCTYPE html>
      <html lang="en">
      <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>Unsubscribed | Tracxn</title>
          <style>
              :root {
                  /* Tracxn / Enterprise Palette */
                  --brand-color: #0d6efd;
                  --brand-dark: #0a58ca;
                  --text-primary: #212529;
                  --text-secondary: #6c757d;
                  --bg-page: #ffffff;
                  --border-color: #dee2e6;
                  --success-color: #198754;
              }

              * {
                  margin: 0;
                  padding: 0;
                  box-sizing: border-box;
                  -webkit-font-smoothing: antialiased;
                  -moz-osx-font-smoothing: grayscale;
              }

              body {
                  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
                  background-color: var(--bg-page);
                  color: var(--text-primary);
                  display: flex;
                  flex-direction: column;
                  align-items: center;
                  justify-content: center;
                  min-height: 100vh;
                  padding: 24px;
              }

              /* Main Layout Wrapper */
              .wrapper {
                  width: 100%;
                  max-width: 500px;
              }

              /* Branding Area */
              .brand-header {
                  text-align: left;
                  margin-bottom: 24px;
                  padding-bottom: 24px;
                  border-bottom: 1px solid var(--border-color);
              }

              .logo {
                  font-size: 24px;
                  font-weight: 800;
                  color: var(--brand-dark);
                  text-decoration: none;
                  letter-spacing: -0.5px;
                  text-transform: uppercase;
              }

              /* Status Content */
              .content {
                  margin-bottom: 40px;
              }

              .status-header {
                  display: flex;
                  align-items: center;
                  gap: 12px;
                  margin-bottom: 16px;
              }

              .icon-check {
                  color: var(--success-color);
                  width: 28px;
                  height: 28px;
                  flex-shrink: 0;
              }

              h1 {
                  font-size: 22px;
                  font-weight: 700;
                  color: var(--text-primary);
                  line-height: 1.2;
              }

              p {
                  font-size: 16px;
                  line-height: 1.6;
                  color: var(--text-secondary);
                  margin-bottom: 0;
              }

              /* Minimal Footer */
              .footer {
                  margin-top: 48px;
                  padding-top: 24px;
                  border-top: 1px solid var(--border-color);
                  text-align: left;
              }

              .footer-links {
                  display: flex;
                  flex-wrap: wrap;
                  gap: 24px;
                  margin-bottom: 16px;
              }

              .footer-links a {
                  font-size: 13px;
                  font-weight: 600;
                  color: var(--text-secondary);
                  text-decoration: none;
                  transition: color 0.2s ease;
              }
              
              .footer-links a:hover {
                  color: var(--brand-color);
              }

              .copyright {
                  font-size: 12px;
                  color: #adb5bd;
              }

              /* Mobile Optimization */
              @media (max-width: 480px) {
                  .footer-links {
                      gap: 16px;
                  }
              }
          </style>
      </head>
      <body>

          <div class="wrapper">
              <div class="brand-header">
                  <span class="logo">Tracxn</span>
              </div>

              <div class="content">
                  <div class="status-header">
                      <svg class="icon-check" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
                      </svg>
                      <h1>Unsubscribed</h1>
                  </div>
                  
                  <p>
                      We've removed you from our ${campaigname} emails.<br>
                      You won't receive further updates from your Account Manager.
                  </p>
              </div>

              <div class="footer">
                  <div class="footer-links">
                      <a href="https://tracxn.com" target="_blank">Platform</a>
                      <a href="https://tracxn.com/demo" target="_blank">Request Demo</a>
                      <a href="https://www.linkedin.com/company/tracxn" target="_blank">LinkedIn</a>
                  </div>
                  <div class="copyright">
                      &copy; 2026 Tracxn Technologies. All rights reserved.
                  </div>
              </div>
          </div>

      </body>
      </html>
